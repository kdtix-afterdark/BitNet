# Context Compiler regression tests — TASK-LAH-001 through TASK-LAH-004
#
# Runs the full broker contract, run-profile, ledger, context-compiler,
# memory-routing, session-persistence, and logging-config test suite on
# every push and pull-request that touches the relevant sources.
#
# What this covers (GitHub-hosted runners)
# -----------------------------------------
# - broker/turn_trace.py       — Event, TurnResult, VisibilityFlags contracts
# - broker/run_profile.py      — run-profile capability matrix
# - broker/durable_state.py    — ledger round-trip and visibility rules
# - broker/session_store.py    — session seeding + disk persistence
# - broker/prompting.py        — all prompt-assembly helpers and context compiler
# - broker/memory_routing.py   — memory routing patterns and profile-aware evidence
# - broker/config.py           — verbose/debug config fields
# - broker/logging_config.py   — BrokerLogger, log file capture, level filtering
# - tests/test_turn_trace.py              — 60 regression tests (TASK-LAH-001)
# - tests/test_run_profile.py             — 78 regression tests (TASK-LAH-002)
# - tests/test_durable_state.py           — 51 regression tests (TASK-LAH-003)
# - tests/test_prompting.py               — 89 regression tests (TASK-LAH-004)
# - tests/test_memory_routing.py          — memory routing + disk persistence
# - tests/test_logging_config.py          — BrokerLogger + verbose/debug config
# - tests/test_llama_cpp_blas_contract.py — 6 source-level guards (skipped in CI
#                                           when submodule is not checked out)
#
# What requires local Apple Silicon + Metal UAT
# ----------------------------------------------
# The following scenarios cannot be exercised in GitHub-hosted CI because
# they require a live GGUF model loaded on Apple Silicon via llama-server
# with Metal acceleration:
#   1. End-to-end /chat round-trips through compile_context_from_ledger() →
#      LlamaServerRuntime.chat() → repair pipeline.
#   2. Token-budget enforcement (ctx_size, max_new_tokens) under real model
#      generation.
#   3. Multi-turn session continuity across HTTP restart boundaries.
#   4. Memory MCP server integration (mcp_memory_call) with real Knowledge
#      Graph data.
# These are tracked in the local UAT checklist in the TASK-LAH-004 artifact.

name: Broker Contract and Context Compiler Tests

on:
  push:
    paths:
      - "broker/prompting.py"
      - "broker/durable_state.py"
      - "broker/session_store.py"
      - "broker/run_profile.py"
      - "broker/turn_trace.py"
      - "broker/memory_routing.py"
      - "broker/config.py"
      - "broker/logging_config.py"
      - "broker/server.py"
      - "tests/test_turn_trace.py"
      - "tests/test_run_profile.py"
      - "tests/test_durable_state.py"
      - "tests/test_prompting.py"
      - "tests/test_memory_routing.py"
      - "tests/test_logging_config.py"
      - "tests/test_llama_cpp_blas_contract.py"
      - ".github/workflows/test-prompting.yml"
  pull_request:
    paths:
      - "broker/prompting.py"
      - "broker/durable_state.py"
      - "broker/session_store.py"
      - "broker/run_profile.py"
      - "broker/turn_trace.py"
      - "broker/memory_routing.py"
      - "broker/config.py"
      - "broker/logging_config.py"
      - "broker/server.py"
      - "tests/test_turn_trace.py"
      - "tests/test_run_profile.py"
      - "tests/test_durable_state.py"
      - "tests/test_prompting.py"
      - "tests/test_memory_routing.py"
      - "tests/test_logging_config.py"
      - "tests/test_llama_cpp_blas_contract.py"
      - ".github/workflows/test-prompting.yml"

jobs:
  test:
    name: Broker contracts, run profiles, ledger, context compiler, memory routing, and logging
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run all broker tests
        run: |
          python -m pytest \
            tests/test_turn_trace.py \
            tests/test_run_profile.py \
            tests/test_durable_state.py \
            tests/test_prompting.py \
            tests/test_memory_routing.py \
            tests/test_logging_config.py \
            tests/test_llama_cpp_blas_contract.py \
            -v
